<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>状態の出し分け</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.ph svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scr{width:390px;height:844px;background:#0F1114;color:#E2E2E9;display:flex;flex-direction:column;position:relative;overflow:hidden;flex-shrink:0}
.ibtn{width:48px;height:48px;border:0;background:none;color:#E2E2E9;display:grid;place-items:center;border-radius:24px;padding:0;cursor:pointer}
.bar{height:64px;display:flex;align-items:center;gap:4px;padding:0 4px 0 20px;flex-shrink:0}
.navi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;line-height:16px;color:#C2C7D0;text-decoration:none;font-weight:500}
.pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.nav{height:80px;flex-shrink:0;background:#171B20;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 32px;text-align:center}
.badge{width:72px;height:72px;border-radius:36px;background:#171B20;display:grid;place-items:center;color:#C2C7D0}
.badge svg{width:32px;height:32px}
.h{margin:0;font-size:17px;line-height:24px;font-weight:700}
.p{margin:0;font-size:14px;line-height:22px;color:#C2C7D0}
.pri{height:48px;padding:0 24px;border-radius:12px;border:0;background:#9ECAFF;color:#003258;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.sec{height:48px;padding:0 16px;border-radius:12px;border:0;background:none;color:#9ECAFF;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
</style>
</helmet>
<div class="ph" style="width: 1680px; height: 844px; display: flex; gap: 40px; font-family: 'Noto Sans JP', sans-serif; background: transparent">

  <section class="scr" aria-label="空の状態">
    <div class="bar"><span style="flex: 1; font-size: 22px; line-height: 28px; font-weight: 700">Personal</span></div>
    <div class="center">
      <span class="badge" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span>
      <h2 class="h">まだ写真がありません</h2>
      <p class="p">端末の写真や動画をアップロードするか、<br>「取り込み」でWebから保存できます。</p>
      <button class="pri">写真・動画を追加</button>
    </div>
    <nav class="nav" aria-label="メイン">
      <a class="navi" href="Main.dc.html" aria-current="page" style="color: #E2E2E9"><span class="pill" style="background: #3B4858; color: #9ECAFF"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span>写真</a>
      <a class="navi" href="Albums.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg></span>アルバム</a>
      <a class="navi" href="Import.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>取り込み</a>
      <a class="navi" href="Settings.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span>設定</a>
    </nav>
  </section>

  <section class="scr" aria-label="接続エラーの状態">
    <div class="bar"><span style="flex: 1; font-size: 22px; line-height: 28px; font-weight: 700">Personal</span></div>
    <div class="center">
      <span class="badge" aria-hidden="true" style="color: #FFB4AB"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M17.5 17.5H7a4 4 0 0 1-1-7.9M9.5 6.2A6 6 0 0 1 18 10a3.5 3.5 0 0 1 2 6.3"/></svg></span>
      <h2 class="h">サーバーに接続できません</h2>
      <p class="p">通信状態を確認して、もう一度お試しください。</p>
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: center">
        <button class="pri">再試行</button>
        <button class="sec" style="color: #C2C7D0; font-weight: 500">接続設定を開く</button>
      </div>
    </div>
    <nav class="nav" aria-label="メイン">
      <a class="navi" href="Main.dc.html" aria-current="page" style="color: #E2E2E9"><span class="pill" style="background: #3B4858; color: #9ECAFF"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span>写真</a>
      <a class="navi" href="Albums.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg></span>アルバム</a>
      <a class="navi" href="Import.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>取り込み</a>
      <a class="navi" href="Settings.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span>設定</a>
    </nav>
  </section>

  <section class="scr" aria-label="ゴミ箱へ移した直後">
    <div class="bar"><span style="flex: 1; font-size: 22px; line-height: 28px; font-weight: 700">Personal</span></div>
    <h3 style="margin: 0; padding: 16px 16px 8px; font-size: 14px; line-height: 20px; font-weight: 700">今日</h3>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="16"><span style="aspect-ratio: 1/1; background: {{t}}"></span></sc-for>
    </div>
    <div style="flex: 1"></div>
    <div role="status" style="margin: 0 8px 12px; min-height: 56px; border-radius: 12px; background: #E2E2E9; color: #0F1114; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 16px; box-shadow: 0 4px 12px rgba(0,0,0,.5)">
      <span style="flex: 1; font-size: 14px; line-height: 20px">3件をゴミ箱に移しました</span>
      <button style="height: 48px; padding: 0 16px; border: 0; background: none; color: #1F4FA8; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">元に戻す</button>
    </div>
    <nav class="nav" aria-label="メイン">
      <a class="navi" href="Main.dc.html" aria-current="page" style="color: #E2E2E9"><span class="pill" style="background: #3B4858; color: #9ECAFF"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span>写真</a>
      <a class="navi" href="Albums.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg></span>アルバム</a>
      <a class="navi" href="Import.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>取り込み</a>
      <a class="navi" href="Settings.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span>設定</a>
    </nav>
  </section>

  <section class="scr" aria-label="未接続（接続画面）">
    <div class="center" style="justify-content: flex-start; padding-top: 96px; text-align: left; align-items: stretch">
      <span class="badge" aria-hidden="true" style="align-self: center"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M17.5 17.5H7a4 4 0 0 1-1-7.9M9.5 6.2A6 6 0 0 1 18 10a3.5 3.5 0 0 1 2 6.3"/></svg></span>
      <h2 class="h" style="text-align: center">サーバーに接続</h2>
      <p class="p" style="text-align: center">写真を見るには接続先を設定してください。<br>取り込みだけなら接続なしで使えます。</p>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C2C7D0">エンドポイント<input type="url" placeholder="https://…" style="height: 52px; border-radius: 12px; border: 1px solid #6B717B; background: #171B20; color: #E2E2E9; padding: 0 16px; font-family: inherit; font-size: 15px"></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C2C7D0">アクセストークン<input type="password" style="height: 52px; border-radius: 12px; border: 1px solid #6B717B; background: #171B20; color: #E2E2E9; padding: 0 16px; font-family: inherit; font-size: 15px"></label>
      <button class="pri" style="height: 52px">接続</button>
      <button class="sec">接続せずに取り込みだけ使う</button>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1680,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var tones = ['#3A4A5C','#5C4B3A','#2F4A43','#4A3A52','#56503A','#3A5258','#4F3A3A','#3E4A33','#2E3A52','#5A4A44','#384447','#4B4458'];
    var t = [];
    for (var i = 0; i < 9; i++) t.push(tones[(i * 7) % tones.length]);
    return { tiles: t };
  }
}
</script>
</body>
</html>
