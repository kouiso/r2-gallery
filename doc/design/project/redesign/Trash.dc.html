<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ゴミ箱</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.ph svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn{width:48px;height:48px;border:0;background:none;color:#E2E2E9;display:grid;place-items:center;border-radius:24px;padding:0;cursor:pointer;text-decoration:none}
.tr{display:flex;align-items:center;gap:12px;min-height:72px;padding:0 8px 0 16px}
.th{width:56px;height:56px;border-radius:8px;flex-shrink:0}
.rb{height:44px;padding:0 16px;border-radius:22px;border:1px solid #6B717B;background:none;color:#E2E2E9;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;flex-shrink:0}
</style>
</helmet>
<div class="ph" style="width: 390px; height: 844px; background: #0F1114; color: #E2E2E9; font-family: 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="height: 64px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px; flex-shrink: 0">
    <a href="Albums.dc.html" class="ibtn" aria-label="戻る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <h1 style="margin: 0; flex: 1; font-size: 20px; line-height: 28px; font-weight: 700">ゴミ箱</h1>
  </header>
  <p style="margin: 0 16px 8px; padding: 12px 16px; border-radius: 12px; background: #171B20; font-size: 13px; line-height: 20px; color: #C2C7D0; display: flex; gap: 12px; align-items: flex-start">
    <svg viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; width: 20px; height: 20px; margin-top: 0"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
    <span>ゴミ箱の項目は、移してから30日たつと自動で完全に削除されます。それまではいつでも元の場所に戻せます。</span>
  </p>
  <main style="flex: 1; overflow: hidden; min-height: 0">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <div class="tr">
        <span class="th" aria-hidden="true" style="background: #1D2127; display: grid; place-items: center; color: #C2C7D0"><sc-if value="{{r.video}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2v8l-4-2"/></svg></sc-if><sc-if value="{{r.image}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></sc-if></span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</div>
          <div style="font-size: 12px; line-height: 16px; color: {{r.color}}">{{r.meta}}</div>
        </div>
        <button class="rb" aria-label="{{r.aria}}">復元</button>
      </div>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var data = [
      ['IMG_1988.jpg', '10月9日', '3.1 MB'],
      ['VID_0877.mp4', '10月6日', '212 MB'],
      ['IMG_1990.jpg', '9月30日', '2.8 MB'],
      ['IMG_1991.jpg', '9月30日', '2.9 MB'],
      ['2026/09/scan_04.png', '9月22日', '1.2 MB'],
      ['IMG_1802.jpg', '9月14日', '3.3 MB'],
      ['IMG_1803.jpg', '9月12日', '3.0 MB']
    ];
    return {
      rows: data.map(function (d) {
        var v = /\.mp4$/.test(d[0]);
        return { name: d[0], video: v, image: !v, meta: d[1] + 'にゴミ箱へ · ' + d[2], color: '#C2C7D0', aria: d[0] + 'を復元' };
      })
    };
  }
}
</script>
</body>
</html>
