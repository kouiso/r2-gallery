# Test-only wrangler config for @cloudflare/vitest-pool-workers.
# Local R2 only; no real buckets or secrets are referenced here.
name = "r2-gallery-worker-test"
main = "src/index.ts"
# 理由: 固定中の @cloudflare/vitest-pool-workers 0.12.21 が同梱する workerd は 2026-03-10 までしか
# 対応せず、これより新しい日付だと実行のたびに切り下げ警告が出て他の警告が埋もれるため揃えている。
# 上位版 (0.13 以降) は vitest 4 系が必須で、tools 側の vitest も巻き込む大きな版上げになるので別途行う。
# 本番の日付 (wrangler.example.toml 等は 2026-09-01) とは差があるので、日付依存の挙動を足す時はこの差を意識すること。
compatibility_date = "2026-03-10"

[[r2_buckets]]
binding = "LIB_A"
bucket_name = "test-bucket-a"

[[r2_buckets]]
binding = "LIB_B"
bucket_name = "test-bucket-b"

[[r2_buckets]]
binding = "META"
bucket_name = "test-bucket-meta"

# Local-only D1 used to exercise the read-only review-meta join.
[[d1_databases]]
binding = "REVIEW_DB"
database_name = "test-review-db"
database_id = "00000000-0000-0000-0000-0000000000d1"

[vars]
LIBRARIES = '[{"id":"a","binding":"LIB_A","title":"Test A"},{"id":"b","binding":"LIB_B","title":"Test B","readOnly":true}]'
ACCESS_TOKEN = "test-access-token"
SIGNING_SECRET = "test-signing-secret"
URL_TTL_SECONDS = "3600"
TRASH_RETENTION_DAYS = "30"
# Shrink the multipart copy threshold so tests exercise the multipart path.
MULTIPART_COPY_MIN_BYTES = "64"
MULTIPART_COPY_PART_BYTES = "5242880"
IMPORT_MAX_BYTES = "1048576"
# Only library "a" may join objects to REVIEW_DB rows.
REVIEW_LIBS = "a"
