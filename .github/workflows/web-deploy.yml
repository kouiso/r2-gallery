name: web-deploy

# Cloudflare Pages のプロジェクトはこのリポジトリ（kouiso/r2-gallery）の Git 連携で、
# production branch は pages-dist・build 無し・出力は root。main への push ごとに dist を
# ビルドしてこのリポジトリの pages-dist へ置くと、その push が Pages のデプロイを起こす。
# 旧経路は archive リポジトリの pages-dist へ PAGES_DEPLOY_KEY で中継 push する形だったが、
# 新プロジェクトがこのリポジトリを直接見るので廃止した（#10）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: write # このリポジトリの pages-dist へ push する
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Build Flutter web distribution
        working-directory: flutter
        run: |
          flutter pub get
          flutter build web --release
      - name: Push dist to pages-dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pages-dist"
          git init -q -b pages-dist "$out"
          cp -r flutter/build/web/. "$out/"
          echo "$GITHUB_SHA" > "$out/.source-sha"
          cd "$out"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -qm "deploy: flutter web dist from main@$GITHUB_SHA"
          # pages-dist はビルド成果物だけの枝で履歴を持たんので毎回置き換える。
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages-dist
