appId: app.r2gallery
---
# 端末のファイルを選んでアップロードし、一覧と Worker の両方に入ること
- launchApp
- runFlow: common/dismiss-no-lock.yaml
- runFlow: common/open-photo-tab.yaml
- extendedWaitUntil:
    visible: "seed-photo.jpg"
    timeout: 30000
- tapOn: "追加"
# 端末の選択画面は Android の版で DocumentsUI か写真ピッカーになる。どちらでも選べるようにする
- extendedWaitUntil:
    visible: "(maestro-upload\\.jpg|Photo taken.*|Photos|Recent|Images|Files|Browse|参照)"
    timeout: 30000
# GET_CONTENT 系ではアプリの選択画面（チューザー）が先に出る。Files を選ぶと DocumentsUI へ進む
- runFlow:
    when:
      visible: "^Files$|^ファイル$"
    commands:
      - tapOn:
          text: "^Files$|^ファイル$"
# 写真ピッカーへ直接入った時は、索引外のファイルを選ぶため Browse で DocumentsUI へ進む
- runFlow:
    when:
      visible: "^Browse$|^参照$"
    commands:
      - tapOn:
          text: "^Browse$|^参照$"
- runFlow:
    when:
      visible: "maestro-upload.jpg"
    commands:
      - tapOn: "maestro-upload.jpg"
- runFlow:
    when:
      visible: "Photo taken.*"
    commands:
      - tapOn:
          text: "Photo taken.*"
          index: 0
# 写真ピッカーはタップで選択状態になるだけなので「Add」で確定する
- runFlow:
    when:
      visible: "Add.*"
    commands:
      - tapOn: "Add.*"
- extendedWaitUntil:
    visible: "1件をアップロード"
    timeout: 20000
- tapOn: "アップロード"
# 一覧に出る名は選んだ側の URI が返す名で決まる。DocumentsUI なら実名、
# 写真ピッカー系の URI なら番号や image:ID で、PickNaming が拡張子を足す
- extendedWaitUntil:
    visible: "(maestro-upload|image:.+|msf:.+|[0-9]+|media)\\.jpg"
    timeout: 60000
- runScript:
    file: check.js
    env:
      CHECK: uploaded
- assertTrue: ${output.check}
