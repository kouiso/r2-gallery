<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ロック画面（提案）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E4B95B}a:hover{color:#F2F0EA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0A0F; color: #F2F0EA; font-family: 'Noto Sans JP', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 0 32px; gap: 12px">
  <svg style="align-self: center" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#E4B95B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
  <h1 style="margin: 4px 0 0; text-align: center; font-size: 20px; line-height: 28px; font-weight: 700">ロック中</h1>
  <p style="margin: 0 0 16px; text-align: center; font-size: 13px; line-height: 20px; color: #9C9AA8">アプリを使うには、ロックを解除してください。</p>
  <button style="height: 52px; border: 0; border-radius: 14px; background: #E4B95B; color: #1A1408; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 11v4M8 9a4 4 0 0 1 8 0v5M5 12a7 7 0 0 1 14 0v3M9 14v4M15 16v3"></path></svg>
    ロックを解除
  </button>
  <p style="margin: 16px 0 0; text-align: center; font-size: 12px; line-height: 16px; color: #9C9AA8">または PIN で解除</p>
  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; line-height: 16px; color: #9C9AA8; text-align: center">PIN
    <input type="password" inputmode="numeric" style="height: 56px; border: 1px solid #6E6C7C; border-radius: 14px; background: #1E1E2B; color: #F2F0EA; text-align: center; font-size: 24px; letter-spacing: 8px; box-sizing: border-box; width: 100%">
  </label>
  <button style="height: 52px; border: 1px solid #6E6C7C; border-radius: 14px; background: transparent; color: #F2F0EA; font-family: inherit; font-size: 15px; font-weight: 700">PINで解除</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
