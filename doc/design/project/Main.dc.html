<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>写真タブ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E4B95B}a:hover{color:#F2F0EA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0A0F; color: #F2F0EA; font-family: 'Noto Sans JP', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="display: flex; flex-direction: column; background: #0A0A0F">
    <div style="height: 56px; display: flex; align-items: center; padding: 0 4px 0 16px; gap: 0">
      <h1 style="margin: 0; flex-grow: 1; font-size: 20px; font-weight: 600">R2 Gallery</h1>
      <button aria-label="並び替え" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F2F0EA; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M6 12h12M10 18h4"></path></svg>
      </button>
      <button aria-label="今すぐロック" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F2F0EA; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 8px; padding: 0 16px 8px">
      <button style="height: 36px; padding: 0 14px; border-radius: 20px; border: 1px solid #E4B95B; background: rgba(228,185,91,0.2); color: #E4B95B; font-weight: 700; font-size: 14px">[ライブラリ1]</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 20px; border: 1px solid #2A2A3A; background: #14141D; color: #9C9AA8; font-weight: 500; font-size: 14px">[ライブラリ2]</button>
    </div>
  </header>
  <main style="flex-grow: 1; overflow: hidden">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
      <section>
        <div style="height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px">
          <span style="font-size: 14px; font-weight: 600">{{d.label}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px">
          <sc-for list="{{d.tiles}}" as="t" hint-placeholder-count="8">
            <div style="aspect-ratio: 1; background: {{t.bg}}; position: relative">
              <sc-if value="{{t.video}}" hint-placeholder-val="{{false}}">
                <svg style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%)" width="28" height="28" viewBox="0 0 24 24" fill="#F2F0EA" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
              </sc-if>
              <sc-if value="{{t.saved}}" hint-placeholder-val="{{false}}">
                <span style="position: absolute; right: 4px; bottom: 4px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center" aria-label="保存済み">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E4B95B" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
                </span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
  <button style="position: absolute; right: 16px; bottom: 96px; height: 56px; padding: 0 20px; border-radius: 16px; border: 0; background: #E4B95B; color: #1A1408; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    追加
  </button>
  <nav style="height: 80px; background: #14141D; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #2A2A3A">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
      <a href="{{tab.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{tab.color}}; font-size: 12px; font-weight: {{tab.weight}}">
        <span style="width: 56px; height: 30px; border-radius: 15px; background: {{tab.pill}}; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{tab.icon}}"></path></svg>
        </span>
        {{tab.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["写真","アルバム","取り込み","設定"],"default":"写真"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = ['#2b2f3d','#3a3226','#24333a','#3b2a2f','#2e3a2a','#33293d','#3d3a2a','#262a33'];
    const mk = (n, off) => Array.from({length: n}, (_, i) => ({ bg: tones[(i + off) % tones.length], video: (i + off) % 3 === 1, saved: (i + off) % 5 === 0 }));
    const active = this.props.active ?? '写真';
    const defs = [
      ['写真', 'Main.dc.html', 'M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4'],
      ['アルバム', 'Albums.dc.html', 'M6 3h12v18H6zM9 7h6M9 11h6'],
      ['取り込み', 'Import.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18'],
      ['設定', 'Settings.dc.html', 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2']
    ];
    return {
      days: [{ label: '今日', tiles: mk(11, 0) }, { label: '昨日', tiles: mk(16, 3) }],
      tabs: defs.map(([label, href, icon]) => ({ label, href, icon,
        color: label === active ? '#F2F0EA' : '#9C9AA8',
        weight: label === active ? 700 : 500,
        pill: label === active ? 'rgba(228,185,91,0.2)' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
