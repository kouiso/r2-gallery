name: maestro

# Flutter 版の通し確認（初回起動・一覧・再生・アップロード・ゴミ箱）を Android エミュレータで流す。
# 接続先は CI の中で立てた手元の Worker（miniflare の R2）で、トークンも署名鍵もこの確認用の固定値。
# 本物の接続先やシークレットは使わない。fork の PR でも安全に流せるよう pull_request で動かす。
# 画面の画像・APK は成果物に上げず、結果は段ごとの合否とログだけを出す。
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - flutter/**
      - worker/**
      - .maestro/**
      - .github/workflows/maestro.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORK: ${{ github.workspace }}/.maestro-work
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Start the local worker and seed media
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          bash .maestro/prepare.sh . "$WORK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable

      - name: Build the release APK for the local worker
        run: |
          set -euo pipefail
          # 手元の Worker は adb reverse で端末の 127.0.0.1:8787 に見せる（run.sh）。http なので、
          # この確認用の APK だけ平文の通信を許す。配る APK とソースはそのまま（この APK は配らない）
          MANIFEST=flutter/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$MANIFEST"
          grep -q 'usesCleartextTraffic="true"' "$MANIFEST"
          cd flutter
          flutter pub get
          flutter test
          # 配布と同じリリース版（AOT）で確かめる。接続先とトークンは手元の Worker の確認用の値
          flutter build apk --release \
            --dart-define=R2_BAKED_ENDPOINT=http://127.0.0.1:8787 \
            --dart-define=R2_BAKED_TOKEN=live-token

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: bash .maestro/run.sh flutter/build/app/outputs/flutter-apk/app-release.apk "$WORK"

      - name: Summarize
        if: always()
        run: python3 .maestro/summary.py "$WORK/maestro-results.xml" "${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
