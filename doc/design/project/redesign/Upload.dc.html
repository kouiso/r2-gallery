<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アップロード確認</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.ph svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pick{display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 8px 8px 16px;border:0;background:#1D2127;border-radius:12px;color:#E2E2E9;font-family:inherit;text-align:left;cursor:pointer;width:100%;box-sizing:border-box}
.k{font-size:12px;line-height:16px;color:#C2C7D0}
.v{font-size:15px;line-height:22px;color:#E2E2E9}
</style>
</helmet>
<div class="ph" style="width: 390px; height: 844px; background: #0F1114; color: #E2E2E9; font-family: 'Noto Sans JP', sans-serif; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; align-content: start; padding-top: 100px">
    <sc-for list="{{bgTiles}}" as="t" hint-placeholder-count="16"><span style="aspect-ratio: 1/1; background: {{t}}"></span></sc-for>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.6)"></div>
  <section role="dialog" aria-labelledby="up-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #171B20; border-radius: 24px 24px 0 0; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <div aria-hidden="true" style="width: 32px; height: 4px; border-radius: 2px; background: #4A4F57; align-self: center"></div>
    <div style="padding: 0 8px">
      <h2 id="up-title" style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 700">5件をアップロード</h2>
      <p style="margin: 4px 0 0; font-size: 13px; line-height: 20px; color: #C2C7D0">写真 3件・動画 2件 · 合計 1.2 GB</p>
    </div>
    <div style="display: flex; gap: 8px; padding: 0 8px; overflow: hidden">
      <sc-for list="{{picked}}" as="p" hint-placeholder-count="5">
        <span style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 8px; background: {{p.bg}}; position: relative">
        </span>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <button class="pick">
        <svg viewBox="0 0 24 24" aria-hidden="true" style="color: #C2C7D0"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        <span style="flex: 1"><span class="k" style="display: block">保存先ライブラリ</span><span class="v">Personal</span></span>
        <span style="width: 40px; display: grid; place-items: center; color: #C2C7D0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
    </div>
    <p style="margin: 0; padding: 0 8px; font-size: 13px; line-height: 20px; color: #C2C7D0">アプリを閉じても続きます。進み具合は画面下の転送バーで確認できます。</p>
    <div style="display: flex; gap: 8px">
      <a href="Main.dc.html" style="flex: 1; height: 52px; border-radius: 12px; border: 1px solid #6B717B; display: grid; place-items: center; color: #E2E2E9; text-decoration: none; font-size: 15px; font-weight: 700">キャンセル</a>
      <a href="Transfers.dc.html" style="flex: 2; height: 52px; border-radius: 12px; background: #9ECAFF; display: grid; place-items: center; color: #003258; text-decoration: none; font-size: 15px; font-weight: 700">アップロード</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var tones = ['#3A4A5C','#5C4B3A','#2F4A43','#4A3A52','#56503A','#3A5258','#4F3A3A','#3E4A33','#2E3A52','#5A4A44','#384447','#4B4458'];
    var bg = [];
    for (var i = 0; i < 20; i++) bg.push(tones[(i * 5) % tones.length]);
    return {
      bgTiles: bg,
      picked: [
        { bg: '#56503A', video: false, dur: '' },
        { bg: '#2F4A43', video: true, dur: '1:24' },
        { bg: '#4A3A52', video: false, dur: '' },
        { bg: '#3A5258', video: true, dur: '0:37' },
        { bg: '#5C4B3A', video: false, dur: '' }
      ]
    };
  }
}
</script>
</body>
</html>
