<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アルバムタブ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#E4B95B}a:hover{color:#F2F0EA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0A0F; color: #F2F0EA; font-family: 'Noto Sans JP', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 56px; display: flex; align-items: center; padding: 0 4px 0 16px">
    <h1 style="margin: 0; flex-grow: 1; font-size: 20px; font-weight: 600">R2 Gallery</h1>
    <button aria-label="今すぐロック" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F2F0EA; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    </button>
  </header>
  <main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 12px 16px">
      <div style="display: flex; flex-grow: 1; border: 1px solid #2A2A3A; border-radius: 20px; overflow: hidden; height: 40px">
        <button style="flex: 1; border: 0; background: rgba(228,185,91,0.2); color: #E4B95B; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>アルバム</button>
        <button style="flex: 1; border: 0; border-left: 1px solid #2A2A3A; background: transparent; color: #F2F0EA; font-size: 14px">フォルダ</button>
      </div>
      <button aria-label="アルバム作成" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F2F0EA; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 16px">
      <button style="aspect-ratio: 1; border: 1px dashed #2A2A3A; border-radius: 12px; background: #14141D; color: #9C9AA8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>アルバム作成</button>
      <sc-for list="{{albums}}" as="a" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="aspect-ratio: 1; border-radius: 12px; background: {{a.bg}}"></div>
          <div style="font-size: 14px; font-weight: 600">{{a.title}}</div>
          <div style="font-size: 12px; color: #9C9AA8; margin-top: -4px">{{a.count}} 件</div>
        </div>
      </sc-for>
    </div>
    <div style="padding: 20px 16px 4px; font-size: 13px; font-weight: 600; color: #9C9AA8">その他</div>
    <a href="#" style="display: flex; align-items: center; gap: 16px; padding: 10px 16px; text-decoration: none; color: #F2F0EA; min-height: 56px; box-sizing: border-box">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
      <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 16px">ゴミ箱</span><span style="font-size: 12px; color: #9C9AA8">移した項目の確認と復元</span></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9C9AA8" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </main>
  <nav style="height: 80px; background: #14141D; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #2A2A3A">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
      <a href="{{tab.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{tab.color}}; font-size: 12px; font-weight: {{tab.weight}}">
        <span style="width: 56px; height: 30px; border-radius: 15px; background: {{tab.pill}}; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{tab.icon}}"></path></svg>
        </span>
        {{tab.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const active = 'アルバム';
    const defs = [
      ['写真', 'Main.dc.html', 'M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4'],
      ['アルバム', 'Albums.dc.html', 'M6 3h12v18H6zM9 7h6M9 11h6'],
      ['取り込み', 'Import.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18'],
      ['設定', 'Settings.dc.html', 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2']
    ];
    return {
      albums: [
        { title: '[アルバム名A]', count: 128, bg: '#2b2f3d' },
        { title: '[アルバム名B]', count: 42, bg: '#3a3226' },
        { title: '[アルバム名C]', count: 7, bg: '#24333a' }
      ],
      tabs: defs.map(([label, href, icon]) => ({ label, href, icon,
        color: label === active ? '#F2F0EA' : '#9C9AA8',
        weight: label === active ? 700 : 500,
        pill: label === active ? 'rgba(228,185,91,0.2)' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
