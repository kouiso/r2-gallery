appId: app.r2gallery
---
# 動画を開くと再生が始まり、「再生できませんでした」にならないこと
- launchApp
- runFlow: common/dismiss-no-lock.yaml
- runFlow: common/open-photo-tab.yaml
- extendedWaitUntil:
    visible: "seed-clip\\.mp4(\\s.*)?"
    timeout: 30000
- tapOn: "seed-clip\\.mp4(\\s.*)?"
- extendedWaitUntil:
    visible: ".*件目 · seed-clip.mp4"
    timeout: 15000
# 再生中なら操作バーの「一時停止」、見終わっていれば「再生が終了しました」が出る。
# 操作バーは数秒で隠れるので、どちらか一方が見えた時点で再生できたとみなす
- extendedWaitUntil:
    visible: "(一時停止|再生が終了しました(\\s.*)?)"
    timeout: 30000
- assertNotVisible: "再生できませんでした"
- tapOn: "閉じる"
- extendedWaitUntil:
    visible: "seed-photo.jpg"
    timeout: 15000
