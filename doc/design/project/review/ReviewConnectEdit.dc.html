<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>接続先の変更（提案）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E4B95B}a:hover{color:#F2F0EA}
.rc svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.rc label{display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:20px;color:#9C9AA8}
.rc input{height:52px;border-radius:14px;border:1px solid #6E6C7C;background:#1E1E2B;color:#F2F0EA;padding:0 16px;font-family:inherit;font-size:15px;box-sizing:border-box;width:100%}
.rc input::placeholder{color:#9C9AA8}
</style>
</helmet>
<div class="rc" style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0A0F; color: #F2F0EA; font-family: 'Noto Sans JP', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 4px; flex-shrink: 0">
    <a href="ReviewSettings.dc.html" aria-label="設定へ戻る" style="width: 48px; height: 48px; display: grid; place-items: center; color: #F2F0EA"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <h1 style="margin: 0; flex-grow: 1; font-size: 20px; line-height: 28px; font-weight: 700">接続先を変更</h1>
  </header>
  <main style="flex-grow: 1; min-height: 0; padding: 8px 24px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="background: #14141D; border: 1px solid #2A2A3A; border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
      <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: #7FD1A8; flex-shrink: 0"></span>
      <span style="min-width: 0"><span style="display: block; font-size: 13px; line-height: 20px; color: #9C9AA8">今の接続先</span><span style="display: block; font-size: 15px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[接続先ホスト]</span></span>
    </div>
    <label>エンドポイント<input type="url" value="https://[接続先ホスト]" aria-describedby="rc-hint"></label>
    <label>アクセストークン<input type="password" placeholder="変えない時は空のまま"></label>
    <p id="rc-hint" style="margin: -4px 0 0; font-size: 12px; line-height: 18px; color: #9C9AA8">r2g://setup… のペアリング文字列を、どちらの欄に貼り付けても入ります。</p>
    <div role="status" style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-radius: 14px; background: #14141D; border: 1px solid #2A2A3A">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="color: #7FD1A8; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
      <span><span style="display: block; font-size: 14px; line-height: 20px">接続できました</span><span style="display: block; font-size: 12px; line-height: 18px; color: #9C9AA8">ライブラリ 2 件が見つかりました。保存すると切り替わります。</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px">
      <button style="height: 52px; border-radius: 14px; border: 1px solid #6E6C7C; background: transparent; color: #F2F0EA; font-family: inherit; font-size: 15px; font-weight: 700">接続を試す</button>
      <button style="height: 52px; border-radius: 14px; border: 0; background: #E4B95B; color: #1A1408; font-family: inherit; font-size: 15px; font-weight: 700">保存して切り替える</button>
    </div>
    <p style="margin: 0; font-size: 12px; line-height: 18px; color: #9C9AA8">つながらなかった時は保存されず、今の接続のまま使えます。失敗した時は理由（接続先に届かない／トークンが違う）をここに出します。</p>
    <div style="flex-grow: 1"></div>
    <button style="height: 48px; border: 0; background: transparent; color: #E0605E; font-family: inherit; font-size: 15px; font-weight: 500">切断して接続情報を消す</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
