name: web-deploy

# Cloudflare Pages の r2-gallery プロジェクトは公開前の private リポジトリ（今の
# kouiso/r2-gallery-archive、repo id で結び付き）の Git 連携のまま残っとる。Pages は連携先を
# 後から差し替えられん。実測: push の通知は repo id（archive）で受け、clone は登録時の名前
# kouiso/r2-gallery（このリポジトリ）から取る。なので同じ dist commit を先にこのリポジトリの
# pages-dist へ、次に archive の pages-dist へ置く。archive への push が Pages のデプロイを起こす
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: write # このリポジトリの pages-dist へ push する
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      DIST_REPO: git@github.com:kouiso/r2-gallery-archive.git
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          cache: true
      - name: Build Flutter web distribution
        working-directory: flutter
        run: |
          flutter pub get
          flutter build web --release
      - name: Push dist to pages-dist
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/pages-key"
          printf '%s\n' "$PAGES_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          out="$RUNNER_TEMP/pages-dist"
          git init -q -b pages-dist "$out"
          cp -r flutter/build/web/. "$out/"
          echo "$GITHUB_SHA" > "$out/.source-sha"
          cd "$out"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -qm "deploy: flutter web dist from main@$GITHUB_SHA"
          # pages-dist はビルド成果物だけの枝で履歴を持たんので毎回置き換える。
          # clone 元（このリポジトリ）を先に置かんと、archive への push で始まる Pages の clone が落ちる
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages-dist
          git push -f "$DIST_REPO" pages-dist
          rm -f "$key"
