<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アルバムタブ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.ph svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn{width:48px;height:48px;border:0;background:none;color:#E2E2E9;display:grid;place-items:center;border-radius:24px;padding:0;cursor:pointer}
.navi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;line-height:16px;color:#C2C7D0;text-decoration:none;font-weight:500}
.pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.seg{flex:1;height:44px;border:0;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:#E2E2E9;border:0;background:none;padding:0;text-align:left;font-family:inherit;cursor:pointer}
.util{display:flex;align-items:center;gap:16px;height:64px;padding:0 8px 0 16px;color:#E2E2E9;text-decoration:none}
</style>
</helmet>
<div class="ph" style="width: 390px; height: 844px; background: #0F1114; color: #E2E2E9; font-family: 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="height: 64px; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 20px; flex-shrink: 0">
    <h1 style="margin: 0; flex: 1; display: flex"><button class="ibtn" aria-label="ライブラリを切り替え（現在: Personal）" style="width: auto; margin-left: -12px; padding: 0 8px 0 12px; display: flex; align-items: center; gap: 4px; border-radius: 12px; font-family: inherit; font-size: 22px; line-height: 28px; font-weight: 700">Personal<svg viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M6 9l6 6 6-6"/></svg></button></h1>
    <button class="ibtn" aria-label="新しいアルバム"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>
  <div role="tablist" aria-label="表示の切り替え" style="margin: 0 16px 8px; padding: 4px; border-radius: 12px; background: #171B20; display: flex; gap: 4px; flex-shrink: 0">
    <button class="seg" role="tab" aria-selected="true" style="background: #3B4858; color: #E2E2E9; border-radius: 8px"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: #9ECAFF"><path d="M5 12l5 5 9-10"/></svg>アルバム</button>
    <button class="seg" role="tab" aria-selected="false" style="background: none; color: #C2C7D0; border-radius: 8px">フォルダ</button>
  </div>
  <main style="flex: 1; overflow: hidden; min-height: 0; padding: 8px 16px 0">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px">
      <sc-for list="{{albums}}" as="a" hint-placeholder-count="6">
        <button class="card" aria-label="{{a.aria}}">
          <span style="display: block; aspect-ratio: 1/1; width: 100%; border-radius: 12px; background: {{a.bg}}"></span>
          <span style="display: flex; flex-direction: column; padding: 0 2px">
            <span style="font-size: 15px; line-height: 22px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.name}}</span>
            <span style="font-size: 12px; line-height: 16px; color: #C2C7D0">{{a.count}}</span>
          </span>
        </button>
      </sc-for>
    </div>
    <h2 style="margin: 24px 0 4px; font-size: 14px; line-height: 20px; font-weight: 700; color: #C2C7D0">その他</h2>
    <div style="background: #171B20; border-radius: 16px; overflow: hidden">
      <a class="util" href="Trash.dc.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 22px">ゴミ箱</span><span style="font-size: 12px; line-height: 16px; color: #C2C7D0">移してから30日で自動削除</span></span>
        <span style="width: 48px; height: 48px; display: grid; place-items: center; color: #C2C7D0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
      </a>
    </div>
  </main>
  <nav aria-label="メイン" style="height: 80px; flex-shrink: 0; background: #171B20; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a class="navi" href="Main.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span>写真</a>
    <a class="navi" href="Albums.dc.html" aria-current="page" style="color: #E2E2E9"><span class="pill" style="background: #3B4858; color: #9ECAFF"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg></span>アルバム</a>
    <a class="navi" href="Import.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>取り込み</a>
    <a class="navi" href="Settings.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span>設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [['練習記録', 312, '#2F4A43'], ['お気に入り', 48, '#5C4B3A'], ['大会 2026', 126, '#3A4A5C'], ['動画', 87, '#4A3A52']];
    return {
      albums: list.map(function (a) {
        return { name: a[0], count: a[1] + '件', bg: a[2], aria: a[0] + '、' + a[1] + '件' };
      })
    };
  }
}
</script>
</body>
</html>
