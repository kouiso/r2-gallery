<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.ph svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;line-height:16px;color:#C2C7D0;text-decoration:none;font-weight:500}
.pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.gh{margin:20px 4px 8px;font-size:13px;line-height:20px;font-weight:700;color:#C2C7D0}
.grp{background:#171B20;border-radius:16px;overflow:hidden}
.it{display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 16px;box-sizing:border-box;border:0;background:none;width:100%;color:#E2E2E9;font-family:inherit;text-align:left;cursor:pointer}
.it+.it{border-top:1px solid #2A2E33}
.t{font-size:15px;line-height:22px}
.s{font-size:12px;line-height:16px;color:#C2C7D0}
.val{font-size:14px;color:#C2C7D0;display:flex;align-items:center;gap:4px;flex-shrink:0}
</style>
</helmet>
<div class="ph" style="width: 390px; height: 844px; background: #0F1114; color: #E2E2E9; font-family: 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="height: 64px; display: flex; align-items: center; padding: 0 20px; flex-shrink: 0">
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">設定</h1>
  </header>
  <main style="flex: 1; overflow: hidden; min-height: 0; padding: 0 16px">
    <h2 class="gh" style="margin-top: 4px">接続</h2>
    <div class="grp">
      <button class="it">
        <span style="width: 10px; height: 10px; border-radius: 5px; background: #7FD1A8; flex-shrink: 0" aria-hidden="true"></span>
        <span style="flex: 1; min-width: 0"><span class="t" style="display: block">接続中</span><span class="s" style="display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">gallery.example.workers.dev · ライブラリ 2</span></span>
        <span class="val">変更<svg viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>
    </div>
    <h2 class="gh">ロック</h2>
    <div class="grp">
      <label class="it">
        <span style="flex: 1"><span class="t" style="display: block">画面ロックで保護</span><span class="s" style="display: block">写真・アルバムを開くとき指紋・顔・PINを求めます</span></span>
        <input type="checkbox" role="switch" checked style="width: 52px; height: 32px; accent-color: #9ECAFF; flex-shrink: 0; margin: 0">
      </label>
      <button class="it">
        <span style="flex: 1"><span class="t" style="display: block">再ロックまでの時間</span><span class="s" style="display: block">アプリを離れてからロックするまで</span></span>
        <span class="val">1時間<svg viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>
      <button class="it">
        <span style="flex: 1" class="t">今すぐロック</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" style="color: #C2C7D0"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
    </div>
    <h2 class="gh">オフライン保存</h2>
    <div class="grp">
      <div class="it" style="cursor: default">
        <span style="flex: 1"><span class="t" style="display: block">端末に暗号化して保存中</span><span class="s" style="display: block">128件 · 2.3 GB</span></span>
      </div>
      <button class="it" style="color: #FFB4AB"><span class="t" style="flex: 1">オフライン保存をすべて削除</span></button>
    </div>
    <h2 class="gh">このアプリについて</h2>
    <div class="grp">
      <div class="it" style="cursor: default"><span class="t" style="flex: 1">バージョン</span><span class="val">[バージョン]</span></div>
    </div>
  </main>
  <nav aria-label="メイン" style="height: 80px; flex-shrink: 0; background: #171B20; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a class="navi" href="Main.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span>写真</a>
    <a class="navi" href="Albums.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg></span>アルバム</a>
    <a class="navi" href="Import.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>取り込み</a>
    <a class="navi" href="Settings.dc.html" aria-current="page" style="color: #E2E2E9"><span class="pill" style="background: #3B4858; color: #9ECAFF"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span>設定</a>
  </nav>
</div>
