<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定タブ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E4B95B}a:hover{color:#F2F0EA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0A0F; color: #F2F0EA; font-family: 'Noto Sans JP', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 56px; display: flex; align-items: center; padding: 0 4px 0 16px">
    <h1 style="margin: 0; flex-grow: 1; font-size: 20px; font-weight: 600">R2 Gallery</h1>
    <button aria-label="今すぐロック" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F2F0EA; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    </button>
  </header>
  <div style="display: flex; gap: 8px; padding: 0 16px 8px">
    <button style="height: 36px; padding: 0 14px; border-radius: 20px; border: 1px solid #E4B95B; background: rgba(228,185,91,0.2); color: #E4B95B; font-weight: 700; font-size: 14px">[ライブラリ1]</button>
    <button style="height: 36px; padding: 0 14px; border-radius: 20px; border: 1px solid #2A2A3A; background: #14141D; color: #9C9AA8; font-weight: 500; font-size: 14px">[ライブラリ2]</button>
  </div>
  <main style="flex-grow: 1; padding: 0 16px 8px; display: flex; flex-direction: column; gap: 8px">
    <div style="background: #14141D; border: 1px solid #2A2A3A; border-radius: 16px; display: flex; align-items: center; gap: 16px; padding: 12px 16px; min-height: 64px; box-sizing: border-box">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: #7FD1A8; flex-shrink: 0"></span>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">接続中</span><span style="font-size: 12px; color: #9C9AA8">[接続先ホスト] · ライブラリ 2</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="background: #14141D; border: 1px solid #2A2A3A; border-radius: 16px; display: flex; align-items: center; gap: 16px; padding: 12px 16px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E4B95B" stroke-width="2" aria-hidden="true"><path d="M12 11v4M8 9a4 4 0 0 1 8 0v5M5 12a7 7 0 0 1 14 0v3M9 14v4M15 16v3"></path></svg>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">画面ロックで保護</span><span style="font-size: 12px; color: #9C9AA8">写真・アルバム・設定を開くとき、指紋・顔・PINを求めます</span></span>
        <span role="switch" aria-checked="true" aria-label="画面ロックで保護" style="width: 52px; height: 32px; border-radius: 16px; background: #E4B95B; position: relative; flex-shrink: 0"><span style="position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: #1A1408"></span></span>
      </div>
      <div style="background: #14141D; border: 1px solid #2A2A3A; border-radius: 16px; display: flex; align-items: center; gap: 16px; padding: 12px 16px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E4B95B" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">再ロックまでの時間</span><span style="font-size: 12px; color: #9C9AA8">アプリを離れてからロックするまで</span></span>
        <span style="color: #9C9AA8; font-size: 14px">毎回ロック</span>
      </div>
      <div style="background: #14141D; border: 1px solid #2A2A3A; border-radius: 16px; display: flex; align-items: center; gap: 16px; padding: 12px 16px; min-height: 56px; box-sizing: border-box">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E4B95B" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <span style="font-size: 16px">今すぐロック</span>
      </div>
      <div style="background: #14141D; border: 1px solid #2A2A3A; border-radius: 16px; display: flex; align-items: center; gap: 16px; padding: 12px 16px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E4B95B" stroke-width="2" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"></rect><path d="M7 12h.01M12 12h.01M17 12h.01"></path></svg>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">PINを設定</span><span style="font-size: 12px; color: #9C9AA8">画面ロックの代わりに、PINでも解除できます</span></span>
      </div>
      <div style="background: #14141D; border: 1px solid #2A2A3A; border-radius: 16px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 16px; padding: 10px 16px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E4B95B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v9M8 10l4 4 4-4M5 20l4-4M5 20h14"></path></svg>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">オフライン保存</span><span style="font-size: 12px; color: #9C9AA8">[件数]件</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9C9AA8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; padding: 10px 16px; min-height: 48px; box-sizing: border-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E0605E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
          <span style="font-size: 16px">オフライン保存をすべて削除</span>
        </div>
      </div>
    </div>
    <div style="background: #14141D; border: 1px solid #2A2A3A; border-radius: 16px; display: flex; align-items: center; gap: 16px; padding: 12px 16px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E0605E" stroke-width="2" aria-hidden="true"><path d="M9 15l6-6M10 6l1-1a5 5 0 0 1 7 7l-1 1M14 18l-1 1a5 5 0 0 1-7-7l1-1M3 3l18 18"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #E0605E">切断</span><span style="font-size: 12px; color: #9C9AA8">保存した接続情報を消去します</span></span>
    </div>
    <p style="margin: 8px 0 0; text-align: center; font-size: 12px; color: #9C9AA8">R2 Gallery (Flutter) 0.1.0</p>
  </main>
  <nav style="height: 80px; background: #14141D; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #2A2A3A">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
      <a href="{{tab.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{tab.color}}; font-size: 12px; font-weight: {{tab.weight}}">
        <span style="width: 56px; height: 30px; border-radius: 15px; background: {{tab.pill}}; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{tab.icon}}"></path></svg>
        </span>
        {{tab.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const active = '設定';
    const defs = [
      ['写真', 'Main.dc.html', 'M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4'],
      ['アルバム', 'Albums.dc.html', 'M6 3h12v18H6zM9 7h6M9 11h6'],
      ['取り込み', 'Import.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18'],
      ['設定', 'Settings.dc.html', 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2']
    ];
    return {
      tabs: defs.map(([label, href, icon]) => ({ label, href, icon,
        color: label === active ? '#F2F0EA' : '#9C9AA8',
        weight: label === active ? 700 : 500,
        pill: label === active ? 'rgba(228,185,91,0.2)' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
