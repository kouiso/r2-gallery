<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>バックグラウンド再生の通知</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #101216; color: #F2F0EA; font-family: 'Noto Sans JP', system-ui, sans-serif; display: flex; flex-direction: column">
  <section style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 24px 16px; background: #1A1D24">
    <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #B9BCC6">通知欄（他のアプリを使用中）</h2>
    <div style="background: #2A2E38; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 10px; background: #0A0A0F; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#E4B95B" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">R2 Gallery</span>
          <span style="font-size: 13px; color: #C9CCD4">{{state}}</span>
        </span>
      </div>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 44px; border: 0; border-radius: 22px; background: #3A3F4B; color: #F2F0EA; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{toggleIcon}}"></path></svg>{{toggleLabel}}</button>
        <button style="flex: 1; height: 44px; border: 0; border-radius: 22px; background: #3A3F4B; color: #F2F0EA; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12"></rect></svg>停止</button>
      </div>
    </div>
    <p style="margin: 0; font-size: 12px; color: #B9BCC6">ファイル名・サムネイルは出さない。通知をタップすると動画の画面へ戻る（ロックの猶予を過ぎていればロック画面を挟む）。</p>
  </section>
  <section style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 24px 16px; background: #050608">
    <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #B9BCC6">端末のロック画面（画面オフ → 点灯）</h2>
    <div style="align-self: center; font-size: 56px; font-weight: 300; letter-spacing: 2px; margin: 8px 0">12:34</div>
    <div style="background: rgba(255,255,255,0.1); border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; border-radius: 10px; background: #0A0A0F; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#E4B95B" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">R2 Gallery</span>
        <span style="font-size: 13px; color: #C9CCD4">{{state}}</span>
      </span>
      <button aria-label="{{toggleLabel}}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.15); color: #F2F0EA; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{toggleIcon}}"></path></svg>
      </button>
      <button aria-label="停止" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.15); color: #F2F0EA; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12"></rect></svg>
      </button>
    </div>
    <p style="margin: 0; font-size: 12px; color: #B9BCC6">音だけ続く。映像は出さない。端末のロックを解除しても、アプリ内のロックは別に効く。</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"playing":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const playing = this.props.playing ?? true;
    return {
      state: playing ? '動画を再生中' : '動画を一時停止中',
      toggleLabel: playing ? '一時停止' : '再生',
      toggleIcon: playing ? 'M6 5h4v14H6zM14 5h4v14h-4z' : 'M8 5v14l11-7z'
    };
  }
}
</script>
</body>
</html>
