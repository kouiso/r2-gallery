<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>取り込みタブ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#E4B95B}a:hover{color:#F2F0EA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0A0F; color: #F2F0EA; font-family: 'Noto Sans JP', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 56px; display: flex; align-items: center; padding: 0 4px 0 16px">
    <h1 style="margin: 0; flex-grow: 1; font-size: 20px; font-weight: 600">R2 Gallery</h1>
    <button aria-label="今すぐロック" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F2F0EA; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    </button>
  </header>
  <main style="flex-grow: 1; display: flex; flex-direction: column; padding: 0 12px">
    <div style="display: flex; align-items: center; padding: 4px 0 4px 4px">
      <h2 style="margin: 0; flex-grow: 1; font-size: 16px; font-weight: 700">ネットから取り込む</h2>
      <button aria-label="ダウンロード履歴" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F2F0EA; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 8px; align-items: center">
      <label style="flex-grow: 1; display: flex; flex-direction: column">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">URL</span>
        <input type="url" placeholder="https://…" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #2A2A3A; background: #14141D; color: #F2F0EA; padding: 0 14px; font-size: 15px">
      </label>
      <button aria-label="移動" style="width: 48px; height: 48px; border-radius: 12px; border: 0; background: #E4B95B; color: #1A1408; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"></path></svg>
      </button>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
      <p style="margin: 0; color: #9C9AA8; font-size: 14px; text-align: center">動画ページのURLを入力して移動</p>
    </div>
  </main>
  <nav style="height: 80px; background: #14141D; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #2A2A3A">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
      <a href="{{tab.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{tab.color}}; font-size: 12px; font-weight: {{tab.weight}}">
        <span style="width: 56px; height: 30px; border-radius: 15px; background: {{tab.pill}}; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{tab.icon}}"></path></svg>
        </span>
        {{tab.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const active = '取り込み';
    const defs = [
      ['写真', 'Main.dc.html', 'M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4'],
      ['アルバム', 'Albums.dc.html', 'M6 3h12v18H6zM9 7h6M9 11h6'],
      ['取り込み', 'Import.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18'],
      ['設定', 'Settings.dc.html', 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2']
    ];
    return {
      tabs: defs.map(([label, href, icon]) => ({ label, href, icon,
        color: label === active ? '#F2F0EA' : '#9C9AA8',
        weight: label === active ? 700 : 500,
        pill: label === active ? 'rgba(228,185,91,0.2)' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
