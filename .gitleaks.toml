[extend]
useDefault = true

# NIST の AES-GCM 公開テストベクタ（Test Case 13〜18 の鍵）。秘密やないのに generic-api-key に当たり、
# main の履歴にあるので全履歴スキャンが毎回落ちる。この値そのものだけを外す
[allowlist]
description = "public NIST AES-GCM vector and local APK public signing digests"
# APK署名検証が出力した公開鍵のfingerprintだけ。秘密鍵・APIキー・ファイル全体は除外しない。
regexes = [
    '''^feffe9928665731c6d6a8f9467308308feffe9928665731c6d6a8f9467308308$''',
    '''^(5746f9988814e33067db7a8f175a6f87862b821d36f6c25e5b6df2625349b4bc|aa168e8b3d3f266a94944fa9555d43dbae68c609|99c247016b391d26af6c6583df02b8b8)$''',
]
