<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>動画ビューア</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#E4B95B}a:hover{color:#F2F0EA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: 'Noto Sans JP', system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="height: 64px; background: rgba(0,0,0,0.55); display: flex; align-items: center; gap: 4px; padding: 0 12px 0 4px">
    <button aria-label="閉じる" style="width: 48px; height: 48px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; min-width: 0">
      <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[ライブラリ名]</span>
      <span style="font-size: 12px; color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">3件目 · [ファイル名].mp4</span>
    </div>
  </div>
  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
    <div style="width: 390px; height: 220px; background: #1d2230; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.45); font-size: 13px">[動画の映像]</div>
  </div>
  <div style="background: rgba(0,0,0,0.75); display: flex; flex-direction: column; padding-bottom: 6px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 13px 0">
      <span style="font-size: 12px">01:40</span>
      <span style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 38%; border-radius: 2px; background: #FFFFFF"></span><span style="position: absolute; left: 38%; top: -6px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #FFFFFF"></span></span>
      <span style="font-size: 12px">04:22</span>
    </div>
    <div style="display: flex; align-items: center">
      <button aria-label="ロック" style="width: 48px; height: 48px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg>
      </button>
      <span style="flex-grow: 1"></span>
      <button aria-label="-10秒" style="width: 48px; height: 48px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"></path></svg>
      </button>
      <button aria-label="一時停止" style="width: 64px; height: 64px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg>
      </button>
      <button aria-label="+10秒" style="width: 48px; height: 48px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v4h-4"></path></svg>
      </button>
      <span style="flex-grow: 1"></span>
      <sc-if value="{{showPip}}" hint-placeholder-val="{{false}}">
        <button aria-label="小窓で再生" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: {{pipRing}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"></rect></svg>
        </button>
      </sc-if>
      <button aria-label="明るさ・音量" style="width: 48px; height: 48px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
      </button>
    </div>
  </div>
  <nav style="height: 72px; background: rgba(0,0,0,0.55); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <sc-for list="{{actions}}" as="a" hint-placeholder-count="5">
      <button style="border: 0; background: transparent; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{a.icon}}"></path></svg>
        {{a.label}}
      </button>
    </sc-for>
  </nav>
  <sc-if value="{{hasNotice}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; left: 12px; right: 12px; bottom: 236px; min-height: 52px; box-sizing: border-box; padding: 10px 8px 10px 16px; border-radius: 8px; background: #1E1E2B; color: #F2F0EA; font-size: 14px; display: flex; align-items: center; gap: 8px; border: 1px solid #2A2A3A">
      <span style="flex-grow: 1">{{notice}}</span>
      <sc-if value="{{hasAction}}" hint-placeholder-val="{{false}}">
        <button style="height: 40px; padding: 0 12px; border: 0; background: transparent; color: #E4B95B; font-size: 14px; font-weight: 600">{{noticeAction}}</button>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showPip":{"editor":"boolean","default":false},"highlightPip":{"editor":"boolean","default":false},"notice":{"editor":"text","default":""},"noticeAction":{"editor":"text","default":""},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const notice = this.props.notice ?? '';
    const noticeAction = this.props.noticeAction ?? '';
    return {
      showPip: this.props.showPip ?? false,
      pipRing: (this.props.highlightPip ?? false) ? 'rgba(228,185,91,0.35)' : 'transparent',
      notice, noticeAction,
      hasNotice: notice.length > 0,
      hasAction: noticeAction.length > 0,
      actions: [
        { label: '情報', icon: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 11v6M12 7.5v.5' },
        { label: 'オフライン', icon: 'M12 4v11M7 10l5 5 5-5M5 20h14' },
        { label: '端末に保存', icon: 'M12 4v9M8 9l4 4 4-4M4 15v4h16v-4' },
        { label: 'アルバムへ', icon: 'M4 6v14h14M8 2h12v14H8zM14 6v6M11 9h6' },
        { label: 'ゴミ箱へ', icon: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13' }
      ]
    };
  }
}
</script>
</body>
</html>
