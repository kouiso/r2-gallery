<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>小窓が使えない時の案内</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; font-family: 'Noto Sans JP', system-ui, sans-serif; color: #FFFFFF">
  <dc-import name="Viewer" show-pip="{{yes}}" notice="{{notice}}" notice-action="{{action}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"reason":{"editor":"enum","options":["許可なし","非対応端末","毎回ロック","ロック中","失敗"],"default":"許可なし"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const m = {
      '許可なし': ['端末の設定で、このアプリの小窓表示が許可されていません', '設定を開く'],
      '非対応端末': ['この端末は小窓での再生に対応していません', ''],
      '毎回ロック': ['画面ロックの猶予が「毎回ロック」のため、小窓では再生できません', ''],
      'ロック中': ['ロック中は小窓で再生できません', ''],
      '失敗': ['いまは小窓にできませんでした。もう一度お試しください', '']
    };
    const [notice, action] = m[this.props.reason ?? '許可なし'] || m['許可なし'];
    return { yes: true, notice, action };
  }
}
</script>
</body>
</html>
