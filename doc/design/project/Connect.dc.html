  <p style="margin: 0 0 12px; text-align: center; font-size: 13px; color: #9C9AA8">写真を見るには接続先を設定してください。取り込みだけなら接続なしで使えます。</p>

  <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #9C9AA8">アクセストークン

  <button style="height: 52px; margin-top: 8px; border: 0; border-radius: 26px; background: #E4B95B; color: #1A1408; font-size: 16px; font-weight: 600">接続する</button>
  <button style="height: 48px; border: 0; background: transparent; color: #E4B95B; font-size: 14px">接続せずに取り込みだけ使う</button>
